<!DOCTYPE html>
<html>
<head>
  <title>Multi-select Test</title>
  <script>
    // 简单的测试脚本
    function testMultiSelect() {
      console.log("Testing multi-select functionality...");

      // 模拟事件
      const event = {
        pointerId: 1,
        metaKey: true,
        ctrlKey: false,
        button: 0,
        target: {
          closest: (selector) => {
            return {
              dataset: { index: '10' }
            };
          }
        }
      };

      // 模拟函数
      let isDraggingSelection = false;
      let activePointerId = 1;
      let selectedIndexes = new Set();

      function selectOnly(index) {
        selectedIndexes = new Set([index]);
        console.log("Selected only:", index);
      }

      function addSelection(index) {
        selectedIndexes.add(index);
        console.log("Added selection:", index, "Current selections:", Array.from(selectedIndexes));
      }

      // 测试单选模式
      isDraggingSelection = true;
      activePointerId = 1;
      selectOnly(10);
      console.log("Single select test passed");

      // 测试多选模式
      event.metaKey = true;
      addSelection(10);
      console.log("Multi-select test passed");

      console.log("All tests passed!");
    }

    window.onload = testMultiSelect;
  </script>
</head>
<body>
  <h1>Multi-select Test</h1>
</body>
</html>
